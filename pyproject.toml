[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reticus"
version = "0.1.0"
description = "Local CV pipeline visualization tool for engineers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Shaman Shetty"},
]
keywords = [
    "computer-vision",
    "machine-learning",
    "experiment-tracking",
    "visualization",
    "pytorch",
    "local",
    "privacy",
    "mlops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Core install stays tiny — only what logging + metrics need.
# Every ML dev already has numpy + Pillow. No web stack forced on headless training.
dependencies = [
    "Pillow>=9.0.0",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
# Dashboard server. `pip install reticus[dashboard]` adds the web stack.
dashboard = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "psutil>=5.9.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0",
]
torch = [
    "torch>=1.13.0",
    "grad-cam>=1.4.0",
]
# Everything.
all = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "psutil>=5.9.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0",
    "torch>=1.13.0",
    "grad-cam>=1.4.0",
]

[project.scripts]
reticus = "reticus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reticus*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
reticus = ["dashboard/dist/**/*", "dashboard/dist/assets/*", "vendor/*"]
